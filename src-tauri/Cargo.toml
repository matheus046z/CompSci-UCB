[package]
name = "compsci-ucb"
version = "0.1.0"
description = "CompSci UCB offline Quartz app"
authors = ["Matheus"]
license = "MIT"
repository = ""
edition = "2021"

[lib]
name = "compsci_ucb_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
